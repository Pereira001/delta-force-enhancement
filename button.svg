<svg xmlns="http://www.w3.org/2000/svg" width="400" height="72" viewBox="0 0 400 72" role="img" aria-label="DLSS5 PowerShell Installer">
  <defs>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0078D4"/>
      <stop offset="55%"  stop-color="#5391FE"/>
      <stop offset="100%" stop-color="#00C2FF"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0078D4" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- Внешняя градиентная рамка с тенью -->
  <rect x="1" y="1" width="398" height="70" rx="18"
        fill="none" stroke="url(#border)" stroke-width="2" filter="url(#softShadow)"/>

  <!-- Белый фон -->
  <rect x="4" y="4" width="392" height="64" rx="15" fill="#FFFFFF"/>

  <!-- Круг под иконку -->
  <circle cx="44" cy="36" r="22" fill="#EEF5FF"/>
  <circle cx="44" cy="36" r="22" fill="none" stroke="#0078D4" stroke-width="1.5" opacity="0.25"/>

  <!-- Иконка PowerShell: >_ -->
  <path d="M 34 26 L 46 36 L 34 46"
        fill="none" stroke="#0078D4" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="48" y1="46" x2="55" y2="46"
        stroke="#0078D4" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Текст -->
  <text x="80" y="33"
        font-family="'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="800" fill="#0A2540">DLSS5</text>
  <text x="137" y="33"
        font-family="'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" fill="#0078D4" letter-spacing="1.5">POWERSHELL</text>
  <text x="80" y="51"
        font-family="'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif"
        font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="2.5">INSTALLER · ONE-CLICK</text>

  <!-- Стрелка -->
  <path d="M 358 36 L 368 36 M 363 31 L 368 36 L 363 41"
        fill="none" stroke="#0078D4" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
</svg>